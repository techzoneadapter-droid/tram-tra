<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Cảm ơn bạn đã gửi yêu cầu | AGATEA</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"></head><body class="success-page"><main class="success-box"><div class="success-mark">✓</div><p class="eyebrow" id="thanks-eyebrow">MỘT LỜI CẢM ƠN TỪ AGATEA</p><h1 id="thanks-heading">Cảm ơn vì đã chọn một điều tinh tế.</h1><p id="thanks-message">Chúng tôi trân trọng sự tin tưởng của bạn. Sau khi ghi nhận đơn hàng, đội ngũ sẽ liên hệ xác nhận thông tin và giao nhận.</p><div class="success-summary" id="success-summary" hidden><div><span>Mã yêu cầu</span><b id="receipt-id"></b></div><div><span>Sản phẩm</span><b id="receipt-product"></b></div><div><span>Số lượng</span><b id="receipt-quantity"></b></div><div><span>Tạm tính</span><b id="receipt-total"></b></div></div><div class="success-actions"><a class="btn" href="./index.html">Trở về AGATEA ↗</a><a class="btn btn-outline" href="./mau-1.html#bo-suu-tap">Tiếp tục khám phá</a></div><p style="margin-top:38px;font:italic 20px Georgia,serif;color:#c7a979">“Quý điều trao, trọng người nhận.”</p></main><script src="./config.js"></script><script src="./tracking.js"></script><script>
(function(){
const p=new URLSearchParams(location.search),demo=p.has("demo"),raw=sessionStorage.getItem("agatea-last-order");let s=null;try{s=JSON.parse(raw)}catch(e){}
if(demo||s?.mode==="demo"){document.querySelector(".success-mark").textContent="◇";document.getElementById("thanks-heading").textContent="Đã xem trước yêu cầu của bạn.";document.getElementById("thanks-message").textContent="Thông tin này chưa được gửi tới cửa hàng. Không có đơn hàng phát sinh.";}
if(s){document.getElementById("success-summary").hidden=false;const set=(id,v)=>document.getElementById(id).textContent=v;set("receipt-id",s.orderId);set("receipt-product",s.product);set("receipt-quantity",String(s.quantity));set("receipt-total",Number(s.subtotal).toLocaleString("vi-VN")+"đ");if(s.mode==="live"&&sessionStorage.getItem("agatea-tracked")!==s.orderId){window.dataLayer=window.dataLayer||[];window.dataLayer.push({event:"agatea_order_submitted",order_id:s.orderId,value:s.subtotal,currency:"VND"});sessionStorage.setItem("agatea-tracked",s.orderId);}}
else{document.getElementById("thanks-heading").textContent="Một lời cảm ơn từ AGATEA.";document.getElementById("thanks-message").textContent="Hãy chọn hộp trà phù hợp và gửi yêu cầu từ trang sản phẩm.";}
})();
</script></body></html>
